[project]
name = "back-artesanic"
version = "0.1.0"
description = "Backend de ArtesaNic: Django + Django REST Framework + PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
# Versiones verificadas el 4-oct-2026 en la documentación oficial de cada proyecto
# (ver ../../docs/arquitectura/desarrollo-local-backend.md). Las versiones exactas instaladas quedan en uv.lock.
dependencies = [
    "django>=5.2.17,<5.3",                      # serie LTS 5.2
    "djangorestframework>=3.18.1,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<5.6", # ADR-003 / ADR-007
    "django-cors-headers>=4.9.0,<5",
    "drf-spectacular>=0.30.0,<0.31",             # OpenAPI generado desde el código
    "psycopg[binary]>=3.3.6,<3.4",
    "python-dotenv>=1.2.4,<2",
    "pillow>=12.0,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
# Aplicación, no biblioteca: uv instala sus dependencias sin empaquetar el proyecto.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ"]
