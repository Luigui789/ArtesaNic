          $ref: '#/components/schemas/ReembolsoTipoEnum'
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        moneda:
          type: string
        estado:
          allOf:
          - $ref: '#/components/schemas/ReembolsoEstadoEnum'
          description: |-
            Derivado: `realizado` cuando existe la devolución registrada.

            * `pendiente` - Pendiente
            * `realizado` - Realizado
        origen:
          $ref: '#/components/schemas/OrigenResolucionEnum'
        cierre:
          type: integer
          nullable: true
          description: Id de la propuesta de cierre aceptada (si es parcial).
        creado_en:
          type: string
          format: date-time
        devolucion:
          allOf:
          - $ref: '#/components/schemas/Devolucion'
