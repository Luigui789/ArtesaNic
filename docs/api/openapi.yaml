          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
    patch:
      operationId: actualizar_mi_taller
      description: 'Modifica solo los campos enviados del perfil público (RF-008).
        Estado, propietario y revisión no son modificables: enviarlos responde 400.
        Editar el perfil no cambia el estado de aprobación.'
      summary: Actualizar el perfil del taller propio
      tags:
      - Talleres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilTallerEntradaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          readOnly: true
          title: Código
          description: Identificador estable que usa la API. No se modifica una vez
            creado.
        nombre:
          type: string
          readOnly: true
      required:
      - codigo
      - id
      - nombre
    CompradorSolicitud:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - id
      - nombre
    Error:
      type: object
      description: Forma de los errores que no son de validación de campos.
      properties:
        detail:
          type: string
      required:
      - detail
    EstadoSolicitudEnum:
      enum:
      - pendiente_revision
      - rechazada
      type: string
      description: |-
        * `pendiente_revision` - Pendiente de revisión
        * `rechazada` - Rechazada
    EstadoTallerEnum:
      enum:
      - pendiente
      - aprobado
      - rechazado
      type: string
      description: |-
        * `pendiente` - Pendiente de aprobación
        * `aprobado` - Aprobado
        * `rechazado` - Rechazado
    LoginRequest:
      type: object
      description: Credenciales de acceso. El rol no se envía; cualquier otro campo
        se rechaza con 400.
      properties:
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - telefono
    ModalidadEnum:
      enum:
      - stock
      - produccion
      - personalizacion
      type: string
      description: |-
        * `stock` - Venta desde stock
        * `produccion` - Producción por cantidad
        * `personalizacion` - Personalización
    OrigenPersonalizacionEnum:
      enum:
      - desde_cero
      - unidad_estandar
      type: string
      description: |-
        * `desde_cero` - Fabricación desde cero
        * `unidad_estandar` - Unidad estándar como base
    PaginatedProductoPropioList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 30
        next:
          type: string
          nullable: true
          format: uri
          example: https://host/api/v1/productos/?page=3&page_size=12
        previous:
          type: string
          nullable: true
          format: uri
          example: https://host/api/v1/productos/?page=1&page_size=12
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductoPropio'
    PaginatedProductoPublicoList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 30
        next:
          type: string
          nullable: true
          format: uri
          example: https://host/api/v1/productos/?page=3&page_size=12
        previous:
          type: string
          nullable: true
          format: uri
          example: https://host/api/v1/productos/?page=1&page_size=12
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductoPublico'
    PaginatedSolicitudArtesanoList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudArtesano'
    PaginatedSolicitudCompradorList:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudComprador'
    PatchedPerfilTallerEntradaRequest:
      type: object
      description: |-
        Datos del perfil que escribe el artesano (RF-008).

        Propietario, estado y revisión no son campos de entrada: enviarlos responde 400.
      properties:
        nombre:
          type: string
          minLength: 1
          title: Nombre del taller
          maxLength: 120
        historia:
          type: string
          maxLength: 2000
        rubro:
          type: string
          minLength: 1
          maxLength: 80
        direccion_completa:
          type: string
          minLength: 1
          title: Dirección completa
          maxLength: 255
        horario:
          type: string
          title: Horario de atención
          maxLength: 200
        telefono_publico:
          type: string
          description: 'Teléfono de contacto público, opcional. No es el teléfono
            de acceso: este nunca se publica si el artesano no lo escribe aquí.'
          maxLength: 32
        whatsapp_publico:
          type: string
          description: WhatsApp de contacto público, opcional.
          maxLength: 32
        facebook_url:
          title: Facebook
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        instagram_url:
          title: Instagram
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        sitio_web:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
    PatchedProductoEntradaRequest:
      type: object
      description: |-
        Datos que escribe el artesano. Taller, publicación y fechas no son campos de entrada:
        enviarlos responde 400. La fotografía principal está pendiente de DR-01.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio en córdobas, con hasta dos decimales. Mayor que cero.
        categoria:
          type: string
          minLength: 1
          title: Código
          description: Código de una categoría de GET /api/v1/categorias/.
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          description: 'Modalidades de venta que admite el producto, solas o combinadas:
            stock, produccion, personalizacion.'
          minItems: 1
    PerfilTallerEntradaRequest:
      type: object
      description: |-
        Datos del perfil que escribe el artesano (RF-008).

        Propietario, estado y revisión no son campos de entrada: enviarlos responde 400.
      properties:
        nombre:
          type: string
          minLength: 1
          title: Nombre del taller
          maxLength: 120
        historia:
          type: string
          maxLength: 2000
        rubro:
          type: string
          minLength: 1
          maxLength: 80
        direccion_completa:
          type: string
          minLength: 1
          title: Dirección completa
          maxLength: 255
        horario:
          type: string
          title: Horario de atención
          maxLength: 200
        telefono_publico:
          type: string
          description: 'Teléfono de contacto público, opcional. No es el teléfono
            de acceso: este nunca se publica si el artesano no lo escribe aquí.'
          maxLength: 32
        whatsapp_publico:
          type: string
          description: WhatsApp de contacto público, opcional.
          maxLength: 32
        facebook_url:
          title: Facebook
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        instagram_url:
          title: Instagram
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        sitio_web:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - direccion_completa
      - nombre
      - rubro
    ProductoEntradaRequest:
      type: object
      description: |-
        Datos que escribe el artesano. Taller, publicación y fechas no son campos de entrada:
        enviarlos responde 400. La fotografía principal está pendiente de DR-01.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio en córdobas, con hasta dos decimales. Mayor que cero.
        categoria:
          type: string
          minLength: 1
          title: Código
          description: Código de una categoría de GET /api/v1/categorias/.
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          description: 'Modalidades de venta que admite el producto, solas o combinadas:
            stock, produccion, personalizacion.'
          minItems: 1
      required:
      - categoria
      - descripcion
      - modalidades
      - nombre
      - precio
    ProductoPropio:
      type: object
      description: 'Producto del taller propio: añade su estado de publicación y última
        edición.'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
          title: Descripción
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Precio (C$)
          description: Precio vigente en córdobas. Los pedidos futuros congelarán
            su propio importe.
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
          description: 'Modalidades de venta que admite, en orden: stock, produccion,
            personalizacion.'
        taller:
          allOf:
          - $ref: '#/components/schemas/TallerResumen'
          readOnly: true
        publicado:
          type: boolean
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado_en
      - categoria
      - creado_en
      - descripcion
      - id
      - modalidades
      - nombre
      - precio
      - publicado
      - taller
    ProductoPublico:
      type: object
      description: Producto del catálogo público. Solo productos publicados de talleres
        aprobados.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
          title: Descripción
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Precio (C$)
          description: Precio vigente en córdobas. Los pedidos futuros congelarán
            su propio importe.
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
          description: 'Modalidades de venta que admite, en orden: stock, produccion,
            personalizacion.'
        taller:
          allOf:
          - $ref: '#/components/schemas/TallerResumen'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - categoria
      - creado_en
      - descripcion
      - id
      - modalidades
      - nombre
      - precio
      - taller
    ProductoSolicitud:
      type: object
      description: Referencia al catálogo vigente, sin precio ni snapshot contractual.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
      required:
      - categoria
      - id
      - nombre
    RegistroArtesanoRequest:
      type: object
      description: Cuenta del artesano más los datos iniciales de su taller.
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre completo.
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo 8 caracteres; no puede ser común, solo numérica ni parecida
            al nombre o al teléfono.
        taller:
          allOf:
          - $ref: '#/components/schemas/PerfilTallerEntradaRequest'
          description: 'Datos iniciales del taller. Obligatorios: nombre, rubro y
            direccion_completa. El taller se crea pendiente de aprobación.'
      required:
      - nombre
      - password
      - taller
      - telefono
    RegistroRequest:
      type: object
      description: Datos para crear una cuenta. Cualquier otro campo se rechaza con
        400.
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre completo.
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo 8 caracteres; no puede ser común, solo numérica ni parecida
            al nombre o al teléfono.
      required:
      - nombre
      - password
      - telefono
    RenglonSolicitud:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        posicion:
          type: integer
          readOnly: true
        producto:
          allOf:
          - $ref: '#/components/schemas/ProductoSolicitud'
          readOnly: true
        modalidad:
          allOf:
          - $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
        cantidad:
          type: integer
          readOnly: true
        fecha_solicitada:
          type: string
          format: date
          readOnly: true
          nullable: true
        caracteristicas:
          type: string
          readOnly: true
        origen_personalizacion:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/OrigenPersonalizacionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        resolucion:
          allOf:
          - $ref: '#/components/schemas/ResolucionRenglonEnum'
          readOnly: true
        motivo_rechazo:
          type: string
          readOnly: true
      required:
      - cantidad
      - caracteristicas
      - fecha_solicitada
      - id
      - modalidad
      - motivo_rechazo
      - origen_personalizacion
      - posicion
      - producto
      - resolucion
    RenglonSolicitudEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        producto:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        modalidad:
          $ref: '#/components/schemas/ModalidadEnum'
        cantidad:
          type: integer
          maximum: 2147483647
          minimum: 1
        fecha_solicitada:
          type: string
          format: date
          description: Obligatoria solo en producción; hoy o una fecha futura.
        caracteristicas:
          type: string
          minLength: 1
          description: Texto libre obligatorio solo en personalización.
          maxLength: 2000
        origen_personalizacion:
          allOf:
          - $ref: '#/components/schemas/OrigenPersonalizacionEnum'
          description: |-
