  /api/v1/pedidos/mios/{pedido_id}/pago/intentos/{intento_id}/corregir/:
    post:
      operationId: corregir_intento_de_pago
      description: 'Crea un intento nuevo de origen `correccion` vinculado al intento
        observado de la URL (debe ser el más reciente y estar `observado`), dentro
        de las 48 h abiertas por la observación. El intento observado y su comprobante
        se conservan. El pago vuelve a `registrado`. `multipart/form-data` con `metodo`
        (`transferencia` | `otro`), `referencia` (1–120 caracteres tras recortar)
        y exactamente un `comprobante` (JPG, JPEG, PNG, WebP o PDF, máximo 10 MiB,
        validado por contenido: extensión, MIME declarado y firma deben coincidir).
        Cualquier otro campo —incluidos monto, moneda o estado— responde 400. Huella
        idempotente: pedido, intento observado, método, referencia y SHA-256 del comprobante.
        `Idempotency-Key` ausente o con formato inválido responde `{"Idempotency-Key":
        ["..."]}`, antes de validar el cuerpo.'
