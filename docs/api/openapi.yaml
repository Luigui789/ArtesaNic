    PropuestaEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        modalidad_entrega:
          allOf:
          - $ref: '#/components/schemas/ModalidadEntregaEnum'
          description: |-
            Si el comprador eligió modalidad, la propuesta adopta la suya y enviar otra responde 400. Si dejó «Sin preferencia», es obligatoria: el artesano define el plan y la ausencia de preferencia no equivale a retiro_taller.

            * `retiro_taller` - Retiro en taller
            * `punto_encuentro` - Punto de encuentro
            * `entrega_artesano` - Entrega por el artesano
            * `otra` - Otra
        descripcion_entrega:
          type: string
          description: Obligatoria con «otra»; opcional con las demás. Si el comprador
            eligió modalidad, la descripción es la suya y enviar otra responde 400.
          maxLength: 500
        costo_entrega:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Costo de entrega definido manualmente por el artesano (RF-016.3).
            Con retiro_taller debe ser 0.00 (400 en otro caso).
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaPropuestaEntradaRequest'
          description: Exactamente los renglones aceptados, una vez cada uno.
          minItems: 1
          maxItems: 50
        otros_cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoEntradaRequest'
          description: Otros servicios.
          maxItems: 20
      required:
      - costo_entrega
      - lineas
    Recepcion:
      type: object
      properties:
        resultado:
          $ref: '#/components/schemas/ResultadoRecepcionEnum'
        motivo:
          type: string
        registrado_en:
          type: string
          format: date-time
      required:
      - motivo
      - registrado_en
      - resultado
    RecepcionEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        resultado:
          $ref: '#/components/schemas/ResultadoRecepcionEnum'
        motivo:
          type: string
          description: Obligatorio y no vacío (tras recortar) en `discrepancia`, hasta
            1000 caracteres; no se admite en `confirmada`.
          maxLength: 1000
      required:
      - resultado
