                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoPago'
          description: 'Conflicto sin efectos; `codigo` estable: `pedido_vencido`,
            `pedido_finalizado`, `pago_ya_confirmado`, `intento_ya_resuelto`, `clave_idempotencia_reutilizada`.
            Nunca modifica ni elimina intentos, revisiones o comprobantes anteriores.'
  /api/v1/pedidos/recibidos/{pedido_id}/reembolso/realizacion/:
    post:
