      operationId: resolver_renglon
      description: 'Resolución final e individual (RF-005, RN-008): pendiente → aceptado
        | rechazado. Rechazar exige motivo no vacío; aceptar no lo admite. No modifica
        cantidad, producto, modalidad ni fechas: no hay contraofertas. Registra historial
        con revisor y fecha. Al resolver el último renglón, la solicitud pasa a lista_propuesta
        si hay alguno aceptado, o a rechazada (DR-03) si todos se rechazaron. Una
        resolución no se invierte ni se repite con otra clave (409 renglon_ya_resuelto).
        Protegida contra reintentos (AUD-08): la huella incluye solicitud, renglón,
        resolución y motivo. Responde la solicitud actualizada. `Idempotency-Key`
        ausente o con formato inválido responde `{"Idempotency-Key": ["..."]}`, antes
        de validar el cuerpo.'
      summary: Aceptar o rechazar un renglón de una solicitud recibida
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: renglon_id
        schema:
          type: integer
        required: true
      - in: path
        name: solicitud_id
        schema:
          type: integer
        required: true
      tags:
      - Solicitudes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolucionEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudArtesano'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoSolicitud'
          description: 'Conflicto sin efectos; `codigo` estable: `renglon_ya_resuelto`,
            `clave_idempotencia_reutilizada`. Nunca sobrescribe una resolución ni
            una propuesta ya registrada.'
  /api/v1/talleres/:
    get:
      operationId: listar_talleres
      description: Perfiles públicos de los talleres aprobados, por nombre. Los pendientes
        y los rechazados no aparecen.
      summary: Listar los talleres aprobados
      tags:
      - Talleres
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TallerPublico'
          description: ''
  /api/v1/talleres/{taller_id}/:
    get:
      operationId: consultar_taller
      summary: Consultar el perfil público de un taller
      parameters:
      - in: path
        name: taller_id
        schema:
          type: integer
        required: true
      tags:
      - Talleres
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPublico'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'No existe, o está pendiente o rechazado: solo se publican
            los talleres aprobados.'
  /api/v1/talleres/mi-taller/:
    get:
      operationId: consultar_mi_taller
      description: Taller del artesano autenticado, en cualquier estado, con el resultado
        de su revisión.
      summary: Consultar el taller propio
      tags:
      - Talleres
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
    patch:
      operationId: actualizar_mi_taller
      description: 'Modifica solo los campos enviados del perfil público (RF-008).
        Estado, propietario y revisión no son modificables: enviarlos responde 400.
        Editar el perfil no cambia el estado de aprobación.'
      summary: Actualizar el perfil del taller propio
      tags:
      - Talleres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActualizarPerfilTallerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActualizarPerfilTallerRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
components:
  schemas:
    Accion:
      type: object
      properties:
        disponible:
          type: boolean
        codigo:
          type: string
          nullable: true
          description: Código `409` que respondería la acción ahora, si no procede.
      required:
      - codigo
      - disponible
    AccionDecisionPropuestaEnum:
      enum:
      - aceptar
      - rechazar
      type: string
      description: |-
        * `aceptar` - Aceptar propuesta
        * `rechazar` - Rechazar propuesta
    AccionesResolucion:
      type: object
      properties:
        cancelar:
          $ref: '#/components/schemas/Accion'
        proponer_cierre:
          $ref: '#/components/schemas/Accion'
      required:
      - cancelar
      - proponer_cierre
    AjusteInventarioRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        delta:
          type: integer
          maximum: 2147483647
          minimum: -2147483647
          description: Variación entera distinta de cero (> 0 ajuste positivo, < 0
            ajuste negativo).
        motivo:
          type: string
          minLength: 1
          description: Motivo obligatorio del ajuste (RF-022, RN-021).
          maxLength: 500
          pattern: \S
      required:
      - delta
      - motivo
    AutorMensaje:
      type: object
      properties:
        id:
          type: integer
          description: Id estable de la cuenta; distingue lo propio.
        nombre:
          type: string
          description: Nombre vigente de la cuenta (puede cambiar).
      required:
      - id
      - nombre
    BlankEnum:
      enum:
      - ''
    Cancelacion:
      type: object
      properties:
        motivo:
          type: string
        registrado_en:
          type: string
          format: date-time
      required:
      - motivo
      - registrado_en
    CancelacionEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        motivo:
          type: string
          description: Imposibilidad justificada; obligatorio, 1–1000 caracteres tras
            recortar.
          maxLength: 1000
      required:
      - motivo
    CantidadEntregada:
      type: object
      properties:
        linea:
          type: integer
        cantidad:
          type: integer
      required:
      - cantidad
      - linea
    CargoEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        descripcion:
          type: string
          minLength: 1
          maxLength: 200
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: C$ con dos decimales, ≥ 0.
        renglon:
          type: integer
          minimum: 1
          description: 'Opcional: renglón aceptado al que se atribuye; sin él, cargo
            global.'
      required:
      - descripcion
      - monto
    CargoPedido:
      type: object
      properties:
        posicion:
          type: integer
          readOnly: true
        descripcion:
          type: string
          readOnly: true
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        renglon:
          type: integer
          readOnly: true
          nullable: true
          description: Renglón aceptado al que se atribuye; null si es un cargo global.
      required:
      - descripcion
      - monto
      - posicion
      - renglon
    CargoPropuesta:
      type: object
      properties:
        posicion:
          type: integer
          readOnly: true
        descripcion:
          type: string
          readOnly: true
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        renglon:
          type: integer
          readOnly: true
          nullable: true
          description: Renglón al que se atribuye; null si es un cargo global.
      required:
      - descripcion
      - monto
      - posicion
      - renglon
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          readOnly: true
          title: Código
          description: Identificador estable que usa la API. No se modifica una vez
            creado.
        nombre:
          type: string
          readOnly: true
      required:
      - codigo
      - id
      - nombre
    CategoriaSnapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - codigo
      - id
      - nombre
    CierreEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        motivo:
          type: string
          description: 'Obligatorio, 1–1000 caracteres tras recortar. Cantidades e
            importes no se envían: los deriva el servidor del ledger de entregas.'
          maxLength: 1000
      required:
      - motivo
    CierreParcial:
      type: object
      properties:
        id:
          type: integer
        numero:
          type: integer
        estado:
          $ref: '#/components/schemas/CierreParcialEstadoEnum'
        motivo:
          type: string
        propuesto_en:
          type: string
          format: date-time
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaCierre'
          description: Snapshot congelado al proponer.
        monto_reembolso:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Σ `importe_reembolso`, calculado por el servidor.
        decision:
          allOf:
          - $ref: '#/components/schemas/DecisionCierre'
          nullable: true
          description: Respuesta del comprador; null mientras esté pendiente.
      required:
      - decision
      - estado
      - id
      - lineas
      - monto_reembolso
      - motivo
      - numero
      - propuesto_en
    CierreParcialEstadoEnum:
      enum:
      - pendiente
      - aceptado
      - objetado
      type: string
      description: |-
        * `pendiente` - Pendiente de respuesta
        * `aceptado` - Cierre aceptado
        * `objetado` - Cierre objetado
    Clasificacion:
      type: object
      properties:
        id:
          type: integer
        cantidad:
          type: integer
        resultado:
          $ref: '#/components/schemas/ResultadoClasificacionEnum'
        motivo:
          type: string
        registrado_en:
          type: string
          format: date-time
      required:
      - cantidad
      - id
      - motivo
      - registrado_en
      - resultado
    ClasificacionEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        obligacion:
          type: integer
          minimum: 1
          description: Id de la obligación.
        cantidad:
          type: integer
          maximum: 2147483647
          minimum: 1
        resultado:
          $ref: '#/components/schemas/ResultadoClasificacionEnum'
        motivo:
          type: string
          description: Obligatorio en ambos resultados, 1–500 caracteres.
          maxLength: 500
      required:
      - cantidad
      - motivo
      - obligacion
      - resultado
    ClasificacionesEntradaRequest:
      type: object
      description: |-
        Rechaza los campos no declarados en lugar de ignorarlos.

        Así una petición no puede colar ``rol``, ``is_staff``, ``is_superuser``,
        ``groups`` ni ``user_permissions``: el intento falla con 400 y no pasa inadvertido.
      properties:
        clasificaciones:
          type: array
          items:
            $ref: '#/components/schemas/ClasificacionEntradaRequest'
          description: Cada obligación una sola vez por petición; el orden no importa.
      required:
      - clasificaciones
    ClasificacionesPedido:
      type: object
      properties:
        pedido:
          type: integer
        obligaciones:
          type: array
          items:
            $ref: '#/components/schemas/ObligacionClasificacion'
      required:
      - obligaciones
      - pedido
    CodigoConflictoIdempotenciaEnum:
      enum:
      - clave_idempotencia_reutilizada
      type: string
      description: '* `clave_idempotencia_reutilizada` - Clave reutilizada con otra
        petición'
    CodigoConflictoInventarioEnum:
      enum:
      - inventario_ya_inicializado
      - inventario_no_inicializado
      - ajuste_bajo_comprometido
      - clave_idempotencia_reutilizada
      type: string
      description: |-
        * `inventario_ya_inicializado` - La existencia inicial de este producto ya fue registrada.
        * `inventario_no_inicializado` - Registra primero la existencia inicial del producto antes de operar.
        * `ajuste_bajo_comprometido` - El ajuste negativo no puede reducir la existencia física por debajo de las unidades reservadas ni de cero.
        * `clave_idempotencia_reutilizada` - Clave reutilizada con otra petición
    CodigoConflictoPagoEnum:
      enum:
      - pago_ya_confirmado
      - pago_en_revision
      - correccion_pendiente
      - correccion_no_permitida
      - intento_ya_resuelto
      - plazo_pago_vencido
      - correccion_fuera_plazo
      - nuevo_intento_fuera_plazo
      - pedido_vencido
      - pedido_finalizado
      - clave_idempotencia_reutilizada
      type: string
      description: |-
        * `pago_ya_confirmado` - El pago de este pedido ya fue confirmado y no admite cambios.
        * `pago_en_revision` - Hay un pago registrado pendiente de revisión del taller.
        * `correccion_pendiente` - El pago fue observado: registra la corrección del intento observado.
        * `correccion_no_permitida` - Solo se puede corregir el intento observado más reciente.
        * `intento_ya_resuelto` - Este intento de pago ya tiene una resolución y no se modifica.
        * `plazo_pago_vencido` - Venció el plazo de 48 horas para registrar el pago.
        * `correccion_fuera_plazo` - Venció el plazo de 48 horas para corregir el pago observado.
        * `nuevo_intento_fuera_plazo` - Venció el plazo de 48 horas para registrar un nuevo intento de pago.
        * `pedido_vencido` - El pedido venció por falta de pago y ya no admite cambios en el pago.
        * `pedido_finalizado` - El pedido ya finalizó y no admite cambios en el pago.
        * `clave_idempotencia_reutilizada` - Clave reutilizada con otra petición
    CodigoConflictoSolicitudEnum:
      enum:
      - renglon_ya_resuelto
      - solicitud_con_renglones_pendientes
      - solicitud_rechazada
      - solicitud_sin_renglones_aceptados
      - propuesta_ya_emitida
      - propuesta_ya_decidida
      - stock_insuficiente
      - clave_idempotencia_reutilizada
      type: string
      description: |-
        * `renglon_ya_resuelto` - Este renglón ya tiene una resolución final y no se modifica.
        * `solicitud_con_renglones_pendientes` - Resuelve todos los renglones antes de emitir la propuesta.
        * `solicitud_rechazada` - La solicitud fue rechazada: todos sus renglones se rechazaron.
        * `solicitud_sin_renglones_aceptados` - La propuesta requiere al menos un renglón aceptado.
        * `propuesta_ya_emitida` - La propuesta final de esta solicitud ya fue emitida.
        * `propuesta_ya_decidida` - Esta propuesta ya tiene una decisión final del comprador y no se modifica.
        * `stock_insuficiente` - No hay disponibilidad suficiente para confirmar la propuesta.
        * `clave_idempotencia_reutilizada` - Clave reutilizada con otra petición
    CompradorSolicitud:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - id
      - nombre
    Comprobante:
      type: object
      properties:
        nombre:
          type: string
          description: Nombre original saneado; solo para mostrar.
        tipo:
          allOf:
          - $ref: '#/components/schemas/ComprobanteTipoEnum'
          description: |-
            MIME detectado.

            * `image/jpeg` - image/jpeg
            * `image/png` - image/png
            * `image/webp` - image/webp
            * `application/pdf` - application/pdf
        tamano:
          type: integer
          description: Bytes.
        url:
          type: string
          description: Endpoint autenticado relativo a la raíz de la API; no es una
            URL pública.
      required:
      - nombre
      - tamano
      - tipo
      - url
    ComprobanteTipoEnum:
      enum:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      type: string
      description: |-
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
        * `image/webp` - image/webp
        * `application/pdf` - application/pdf
    ConfiguracionPublica:
      type: object
      description: Configuración pública. Sin tasa configurada, ambos campos son null
        (D-AUD14-06).
      properties:
        tasa_cambio:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: 'Córdobas por un dólar, como texto decimal con cuatro decimales;
            null si la administración no la ha configurado. Solo informativa: los
            importes contractuales están en córdobas.'
        actualizada_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Fecha de la última actualización de la tasa; null sin tasa.
      required:
      - actualizada_en
      - tasa_cambio
    ConflictoConversacion:
      type: object
      properties:
        detail:
          type: string
          default: Este pedido ya finalizó. La conversación está disponible solo para
            consulta.
        codigo:
          $ref: '#/components/schemas/ConflictoConversacionCodigoEnum'
      required:
      - codigo
    ConflictoConversacionCodigoEnum:
      enum:
      - conversacion_cerrada
      type: string
      description: '* `conversacion_cerrada` - Pedido finalizado: conversación de
        consulta'
    ConflictoCumplimiento:
      type: object
      properties:
        detail:
          type: string
        codigo:
          $ref: '#/components/schemas/ConflictoCumplimientoCodigoEnum'
        lineas:
          type: array
          items:
            type: integer
          description: Líneas del pedido afectadas, cuando el conflicto se refiere
            a renglones.
      required:
      - codigo
      - detail
    ConflictoCumplimientoCodigoEnum:
      enum:
      - pedido_vencido
      - pedido_entregado
      - pago_no_confirmado
      - linea_ya_iniciada
      - linea_no_iniciada
      - cantidad_entrega_excede_pendiente
      - recepcion_ya_registrada
      - pedido_finalizado
      - cierre_parcial_pendiente
      - clave_idempotencia_reutilizada
      type: string
      description: |-
        * `pedido_vencido` - El pedido venció por falta de pago y no admite cumplimiento.
        * `pedido_entregado` - El pedido ya fue entregado por completo.
        * `pago_no_confirmado` - El trabajo y las entregas solo pueden registrarse con el pago confirmado.
        * `linea_ya_iniciada` - Este producto del pedido ya fue iniciado.
        * `linea_no_iniciada` - Inicia el trabajo de cada producto antes de registrar su entrega.
        * `cantidad_entrega_excede_pendiente` - La cantidad indicada supera lo que falta por entregar de ese producto.
        * `recepcion_ya_registrada` - Ya registraste tu respuesta sobre esta entrega.
        * `pedido_finalizado` - El pedido ya finalizó y no admite esta acción.
        * `cierre_parcial_pendiente` - Hay una propuesta de cierre parcial esperando la respuesta del comprador.
        * `clave_idempotencia_reutilizada` - Clave reutilizada con otra petición
    ConflictoIdempotencia:
      type: object
      properties:
        detail:
          type: string
        codigo:
          $ref: '#/components/schemas/CodigoConflictoIdempotenciaEnum'
      required:
      - codigo
      - detail
    ConflictoInventario:
      type: object
      properties:
        detail:
          type: string
        codigo:
          $ref: '#/components/schemas/CodigoConflictoInventarioEnum'
      required:
      - codigo
      - detail
    ConflictoPago:
      type: object
      properties:
        detail:
          type: string
        codigo:
          $ref: '#/components/schemas/CodigoConflictoPagoEnum'
      required:
      - codigo
      - detail
    ConflictoResolucion:
      type: object
      properties:
        detail:
          type: string
        codigo:
          $ref: '#/components/schemas/ConflictoResolucionCodigoEnum'
        obligaciones:
          type: array
