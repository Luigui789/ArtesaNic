        control de ownership (no basta haber listado el pago): solo el comprador del
        pedido o el artesano de su taller. Ajeno o inexistente: 404; anónimo: 401;
        otros roles (incluida la administración): 403. Responde el archivo con su
        MIME detectado, `Content-Disposition: attachment` con nombre generado, `X-Content-Type-Options:
        nosniff` y `Cache-Control: private, no-store`.'
