      enum:
      - pedido_finalizado
      - pedido_vencido
      - cancelacion_requiere_sin_entregas
      - pago_pendiente_de_resolucion
      - cierre_requiere_entrega_parcial
      - cierre_parcial_pendiente
      - cierre_ya_resuelto
      - reembolso_ya_realizado
      - clasificacion_excede_pendiente
      - clave_idempotencia_reutilizada
      type: string
      description: |-
        * `pedido_finalizado` - El pedido ya finalizó y no admite esta acción.
        * `pedido_vencido` - El pedido venció por falta de pago y no admite esta acción.
        * `cancelacion_requiere_sin_entregas` - El pedido ya tiene entregas: en lugar de cancelarlo, propón un cierre parcial.
        * `pago_pendiente_de_resolucion` - Hay un pago registrado u observado sin resolver. Resuélvelo antes de cancelar.
        * `cierre_requiere_entrega_parcial` - El cierre parcial requiere al menos una unidad entregada y otra pendiente.
        * `cierre_parcial_pendiente` - Hay una propuesta de cierre parcial esperando la respuesta del comprador.
        * `cierre_ya_resuelto` - Esta propuesta de cierre ya fue respondida.
        * `reembolso_ya_realizado` - La devolución de este reembolso ya fue registrada.
        * `clasificacion_excede_pendiente` - La cantidad indicada supera las unidades pendientes de clasificar.
        * `clave_idempotencia_reutilizada` - Clave reutilizada con otra petición
