  /api/v1/solicitudes/mias/{solicitud_id}/propuesta/decision/:
    post:
      operationId: decidir_propuesta
      description: 'Decisión final e inmutable del comprador propietario sobre la
        propuesta emitida (AUD-07; RF-005, RF-006, RF-018, RF-022; RN-009, RN-011,
        RN-016). Si envía `rechazar`, registra la decisión histórica sin crear pedido
        ni reservar inventario (`pedido: null`). Si envía `aceptar`, en una única
        transacción PostgreSQL agrega las unidades estándar requeridas por producto
        (`stock` y `personalizacion` con `unidad_estandar`), bloquea y revalida el
        inventario disponible, registra la decisión `aceptada`, congela el `Pedido`
        con su snapshot contractual y crea las reservas activas y los movimientos
        de reserva. Una propuesta ya decidida con otra clave responde `409 propuesta_ya_decidida`;
        la falta de stock disponible revierte toda la transacción y responde `409
        stock_insuficiente`. Protegida por `Idempotency-Key` (AUD-08). `Idempotency-Key`
        ausente o con formato inválido responde `{"Idempotency-Key": ["..."]}`, antes
        de validar el cuerpo.'
      summary: Aceptar o rechazar la propuesta final de una solicitud propia
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: solicitud_id
        schema:
          type: integer
        required: true
      tags:
      - Solicitudes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionPropuestaEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPropuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoSolicitud'
          description: 'Conflicto sin efectos; `codigo` estable: `propuesta_ya_decidida`,
            `stock_insuficiente`, `clave_idempotencia_reutilizada`. Nunca sobrescribe
            una resolución ni una propuesta ya registrada.'
