  /api/v1/pedidos/recibidos/{pedido_id}/entregas/:
    post:
      operationId: registrar_entrega_de_pedido
      description: 'Crea una entrega numerada con su fecha declarada (no futura) y
        las cantidades de uno o varios renglones ya iniciados, sin superar lo pendiente
        de ninguno. Exige `Pago.estado = confirmado`, comprobado en el servidor dentro
        de la transacción y después de bloquear el pedido (`409 pago_no_confirmado`).
        Todo o nada: ante cualquier error no se crea la entrega ni se consume inventario.
        Cada línea `stock` consume de su reserva lo entregado (`consumo`); producción
        y personalización no vuelven a consumir. Cuando todos los renglones quedan
        completos el pedido pasa a `entregado`. Protegida por `Idempotency-Key`: huella
        con `pedido_id`, `fecha` y `lineas` ordenadas por línea. `Idempotency-Key`
        ausente o con formato inválido responde `{"Idempotency-Key": ["..."]}`, antes
        de validar el cuerpo.'
      summary: Registrar una entrega con cantidades por renglón
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
