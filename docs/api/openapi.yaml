  /api/v1/productos/:
    get:
      operationId: listar_catalogo
      description: Productos publicados de talleres aprobados, paginados. Búsqueda
        por nombre; filtros por categoría, rango de precio y taller; orden por fecha,
        precio o nombre. Un parámetro con formato inválido responde 400.
      summary: Consultar el catálogo público
      parameters:
      - in: query
        name: categoria
        schema:
          type: string
          maxLength: 50
        description: Código de categoría.
      - in: query
        name: orden
        schema:
          enum:
          - recientes
          - precio_asc
          - precio_desc
          - nombre
          type: string
          default: recientes
          minLength: 1
        description: |-
          recientes (por defecto), precio_asc, precio_desc o nombre.

          * `recientes` - recientes
          * `precio_asc` - precio_asc
          * `precio_desc` - precio_desc
          * `nombre` - nombre
      - name: page
        required: false
        in: query
        description: Número de página, desde 1. Una página inexistente responde 404.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: 'Resultados por página: 12 por defecto, 48 como máximo.'
        schema:
          type: integer
          minimum: 1
          maximum: 48
          default: 12
      - in: query
        name: precio_max
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio máximo.
      - in: query
        name: precio_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio mínimo.
      - in: query
        name: q
        schema:
          type: string
          maxLength: 120
        description: Búsqueda por nombre (contiene, sin mayúsculas).
      - in: query
        name: taller
        schema:
          type: integer
          minimum: 1
        description: Identificador del taller.
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoPublicoList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
