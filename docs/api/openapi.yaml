        * `ajustar_inventario` - Ajustar inventario
        * `registrar_intento_pago` - Registrar intento de pago
        * `corregir_intento_pago` - Corregir intento de pago observado
        * `resolver_intento_pago` - Resolver intento de pago
        * `iniciar_cumplimiento_linea` - Iniciar el cumplimiento de un renglón
        * `registrar_entrega_pedido` - Registrar entrega de pedido
