  /api/v1/pedidos/mios/{pedido_id}/cierres-parciales/{cierre_id}/respuesta/:
    post:
      operationId: responder_cierre_parcial
      description: 'Una sola respuesta por propuesta (`409 cierre_ya_resuelto`). `aceptado`
        (sin motivo) finaliza el pedido como `cerrado_parcial` en una transacción:
        libera el remanente no manipulado de las reservas, crea las obligaciones de
        clasificación y el reembolso parcial congelado. `objetado` (motivo obligatorio,
        1–1000 caracteres) no tiene efectos laterales: el pedido sigue `en_cumplimiento`
        y el artesano puede seguir entregando o proponer otro cierre. Protegida por
        `Idempotency-Key`: huella con `pedido_id`, `cierre_id`, `decision` y `motivo`
        recortado. `Idempotency-Key` ausente o con formato inválido responde `{"Idempotency-Key":
        ["..."]}`, antes de validar el cuerpo.'
      summary: Aceptar u objetar la propuesta de cierre parcial
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: cierre_id
        schema:
          type: integer
        required: true
      - in: path
        name: pedido_id
        schema:
          type: integer
        required: true
      tags:
      - Resolución de pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaCierreEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolucionPedido'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoResolucion'
          description: 'Conflicto sin efectos (nada se escribe); `codigo` estable:
            `cierre_ya_resuelto`, `pedido_vencido`, `pedido_finalizado`, `clave_idempotencia_reutilizada`.'
