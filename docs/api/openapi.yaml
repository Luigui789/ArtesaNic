          readOnly: true
        publicado:
          type: boolean
          readOnly: true
        moderacion:
          allOf:
          - $ref: '#/components/schemas/ModeracionPropia'
          nullable: true
          readOnly: true
          description: 'Retiro por moderación administrativa: motivo y fecha; null
            si no existe. Un producto moderado no aparece en el catálogo ni puede
            publicarse.'
