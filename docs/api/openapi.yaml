openapi: 3.0.3
info:
  title: API de ArtesaNic
  version: 0.1.0
  description: 'Contrato implementado por el backend. Requisitos y diseño de los demás
    módulos: monorepo (docs/requisitos, docs/api).'
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: obtener_token_csrf
      description: Fija la cookie csrftoken y devuelve el valor que debe enviarse
        en la cabecera X-CSRFToken de registro, login, refrescar y logout.
      summary: Obtener el token CSRF
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCSRF'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: iniciar_sesion
      description: 'El rol no se envía: lo determina la cuenta. Devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Iniciar sesión con teléfono y contraseña
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login:
                value:
                  telefono: '85551234'
                  password: …
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Credenciales incorrectas o cuenta inactiva (mensaje único,
            no revela si el teléfono existe).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido, o cuenta de administración.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/logout/:
    post:
      operationId: cerrar_sesion
      description: Revoca el token de renovación de la cookie y la borra. No exige
        el token de acceso, para poder cerrar aunque haya caducado; es idempotente.
      summary: Cerrar sesión
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/perfil/:
    get:
      operationId: consultar_perfil
      summary: Consultar la identidad autenticada
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
  /api/v1/auth/refrescar/:
    post:
      operationId: renovar_sesion
      description: Usa la cookie de renovación, la rota (la anterior queda revocada)
        y devuelve un token de acceso nuevo. Sin cuerpo.
      summary: Renovar el token de acceso
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAcceso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin cookie, o caducada, revocada o de una cuenta sin acceso.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/registro/artesano/:
    post:
      operationId: registrar_artesano
      description: 'Crea la cuenta de artesano y, en la misma operación, su taller
        en estado pendiente con los datos iniciales de `taller`. Si el taller no es
        válido no se crea ninguno de los dos. El teléfono de la cuenta es privado:
        los contactos públicos del taller son solo los que se envían en `taller`.
        La aprobación es exclusiva de la administración. El rol lo asigna el servidor;
        los campos no declarados se rechazan. Inicia la sesión: devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Registrar una cuenta de artesano
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroArtesanoRequest'
            examples:
              RegistroDeArtesano:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
                  taller:
                    nombre: Cerámica López
                    rubro: Cerámica artesanal
                    direccion_completa: Barrio San Juan, de la iglesia 2 c. al sur,
                      Masaya
                    historia: Taller familiar fundado en 1985.
                    horario: Lunes a sábado, 8:00 a 17:00
                    whatsapp_publico: 8777 6655
                    instagram_url: https://instagram.com/ceramicalopez
                summary: Registro de artesano
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: artesano
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/registro/comprador/:
    post:
      operationId: registrar_comprador
      description: 'Crea una cuenta de comprador. El rol lo asigna el servidor; los
        campos no declarados se rechazan. Inicia la sesión: devuelve el token de acceso
        y fija la cookie de renovación.'
      summary: Registrar una cuenta de comprador
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            examples:
              Registro:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/categorias/:
    get:
      operationId: listar_categorias
      description: Colección completa, por nombre y sin paginar.
      summary: Listar las categorías
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
  /api/v1/productos/:
    get:
      operationId: listar_catalogo
      description: Productos publicados de talleres aprobados, paginados. Búsqueda
        por nombre; filtros por categoría, rango de precio y taller; orden por fecha,
        precio o nombre. Un parámetro con formato inválido responde 400.
      summary: Consultar el catálogo público
      parameters:
      - in: query
        name: categoria
        schema:
          type: string
          maxLength: 50
        description: Código de categoría.
      - in: query
        name: orden
        schema:
          enum:
          - recientes
          - precio_asc
          - precio_desc
          - nombre
          type: string
          default: recientes
          minLength: 1
        description: |-
          recientes (por defecto), precio_asc, precio_desc o nombre.

          * `recientes` - recientes
          * `precio_asc` - precio_asc
          * `precio_desc` - precio_desc
          * `nombre` - nombre
      - in: query
        name: precio_max
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio máximo.
      - in: query
        name: precio_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio mínimo.
      - in: query
        name: q
        schema:
          type: string
          maxLength: 120
        description: Búsqueda por nombre (contiene, sin mayúsculas).
      - in: query
        name: taller
        schema:
          type: integer
          minimum: 1
        description: Identificador del taller.
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoPublico'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
  /api/v1/productos/{producto_id}/:
    get:
      operationId: consultar_producto
      summary: Consultar un producto del catálogo
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPublico'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe, no está publicado o su taller no está aprobado.
  /api/v1/productos/mios/:
    get:
      operationId: listar_mis_productos
      description: Publicados y despublicados, del más reciente al más antiguo, paginados.
        El taller se deriva del token.
      summary: Listar los productos del taller propio
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
    post:
      operationId: crear_producto
      description: Crea el producto sin publicar; se publica con la acción publicar.
        Todos los campos son obligatorios. Taller, publicación y cualquier otro campo
        se rechazan con 400. La fotografía principal está pendiente de la decisión
        DR-01.
      summary: Registrar un producto en el taller propio
      tags:
      - Productos propios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
  /api/v1/productos/mios/{producto_id}/:
    get:
      operationId: consultar_mi_producto
      description: |-
        Productos del taller del artesano autenticado y aprobado.

        El taller sale de la identidad: el queryset se limita a él y ``EsPropietario``
        lo comprueba de nuevo por objeto. Un producto ajeno responde 404, como uno inexistente.
      summary: Consultar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
    patch:
      operationId: actualizar_mi_producto
      description: 'Modifica solo los campos enviados. `modalidades` reemplaza la
        lista completa. No cambia taller, publicación ni fecha de alta: enviarlos
        responde 400. Editar no altera pedidos confirmados, que conservarán sus propios
        datos (RN-003).'
      summary: Editar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductoEntradaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/productos/mios/{producto_id}/despublicar/:
    post:
      operationId: despublicar_mi_producto
      description: Lo retira del catálogo público y de nuevas solicitudes sin borrarlo
        (RF-019). Idempotente. Sin cuerpo.
      summary: Despublicar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/productos/mios/{producto_id}/publicar/:
    post:
      operationId: publicar_mi_producto
      description: 'Lo muestra en el catálogo público. Idempotente: publicar un producto
        ya publicado responde 200 sin cambios. Sin cuerpo.'
      summary: Publicar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/salud/:
    get:
      operationId: consultar_salud
      summary: Comprobar que el servicio responde
      tags:
      - Salud
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
          description: ''
  /api/v1/talleres/:
    get:
      operationId: listar_talleres
      description: Perfiles públicos de los talleres aprobados, por nombre. Los pendientes
        y los rechazados no aparecen.
      summary: Listar los talleres aprobados
      tags:
      - Talleres
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TallerPublico'
          description: ''
  /api/v1/talleres/{taller_id}/:
    get:
      operationId: consultar_taller
      summary: Consultar el perfil público de un taller
      parameters:
      - in: path
        name: taller_id
        schema:
          type: integer
        required: true
      tags:
      - Talleres
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPublico'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'No existe, o está pendiente o rechazado: solo se publican
            los talleres aprobados.'
  /api/v1/talleres/mi-taller/:
    get:
      operationId: consultar_mi_taller
      description: Taller del artesano autenticado, en cualquier estado, con el resultado
        de su revisión.
      summary: Consultar el taller propio
      tags:
      - Talleres
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
    patch:
      operationId: actualizar_mi_taller
      description: 'Modifica solo los campos enviados del perfil público (RF-008).
        Estado, propietario y revisión no son modificables: enviarlos responde 400.
        Editar el perfil no cambia el estado de aprobación.'
      summary: Actualizar el perfil del taller propio
      tags:
      - Talleres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilTallerEntradaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallerPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Esta cuenta no tiene un taller registrado.
components:
  schemas:
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          readOnly: true
          title: Código
          description: Identificador estable que usa la API. No se modifica una vez
            creado.
        nombre:
          type: string
          readOnly: true
      required:
      - codigo
      - id
      - nombre
    Error:
      type: object
      description: Forma de los errores que no son de validación de campos.
      properties:
        detail:
          type: string
      required:
      - detail
    EstadoTallerEnum:
      enum:
      - pendiente
      - aprobado
      - rechazado
      type: string
      description: |-
        * `pendiente` - Pendiente de aprobación
        * `aprobado` - Aprobado
        * `rechazado` - Rechazado
    LoginRequest:
      type: object
      description: Credenciales de acceso. El rol no se envía; cualquier otro campo
        se rechaza con 400.
      properties:
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - telefono
    ModalidadEnum:
      enum:
      - stock
      - produccion
      - personalizacion
      type: string
      description: |-
        * `stock` - Venta desde stock
        * `produccion` - Producción por cantidad
        * `personalizacion` - Personalización
    PatchedPerfilTallerEntradaRequest:
      type: object
      description: |-
        Datos del perfil que escribe el artesano (RF-008).

        Propietario, estado y revisión no son campos de entrada: enviarlos responde 400.
      properties:
        nombre:
          type: string
          minLength: 1
          title: Nombre del taller
          maxLength: 120
        historia:
          type: string
          maxLength: 2000
        rubro:
          type: string
          minLength: 1
          maxLength: 80
        direccion_completa:
          type: string
          minLength: 1
          title: Dirección completa
          maxLength: 255
        horario:
          type: string
          title: Horario de atención
          maxLength: 200
        telefono_publico:
          type: string
          description: 'Teléfono de contacto público, opcional. No es el teléfono
            de acceso: este nunca se publica si el artesano no lo escribe aquí.'
          maxLength: 32
        whatsapp_publico:
          type: string
          description: WhatsApp de contacto público, opcional.
          maxLength: 32
        facebook_url:
          title: Facebook
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        instagram_url:
          title: Instagram
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        sitio_web:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
    PatchedProductoEntradaRequest:
      type: object
      description: |-
        Datos que escribe el artesano. Taller, publicación y fechas no son campos de entrada:
        enviarlos responde 400. La fotografía principal está pendiente de DR-01.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio en córdobas, con hasta dos decimales. Mayor que cero.
        categoria:
          type: string
          minLength: 1
          title: Código
          description: Código de una categoría de GET /api/v1/categorias/.
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          description: 'Modalidades de venta que admite el producto, solas o combinadas:
            stock, produccion, personalizacion.'
          minItems: 1
    PerfilTallerEntradaRequest:
      type: object
      description: |-
        Datos del perfil que escribe el artesano (RF-008).

        Propietario, estado y revisión no son campos de entrada: enviarlos responde 400.
      properties:
        nombre:
          type: string
          minLength: 1
          title: Nombre del taller
          maxLength: 120
        historia:
          type: string
          maxLength: 2000
        rubro:
          type: string
          minLength: 1
          maxLength: 80
        direccion_completa:
          type: string
          minLength: 1
          title: Dirección completa
          maxLength: 255
        horario:
          type: string
          title: Horario de atención
          maxLength: 200
        telefono_publico:
          type: string
          description: 'Teléfono de contacto público, opcional. No es el teléfono
            de acceso: este nunca se publica si el artesano no lo escribe aquí.'
          maxLength: 32
        whatsapp_publico:
          type: string
          description: WhatsApp de contacto público, opcional.
          maxLength: 32
        facebook_url:
          title: Facebook
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        instagram_url:
          title: Instagram
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        sitio_web:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - direccion_completa
      - nombre
      - rubro
    ProductoEntradaRequest:
      type: object
      description: |-
        Datos que escribe el artesano. Taller, publicación y fechas no son campos de entrada:
        enviarlos responde 400. La fotografía principal está pendiente de DR-01.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Precio en córdobas, con hasta dos decimales. Mayor que cero.
        categoria:
          type: string
          minLength: 1
          title: Código
          description: Código de una categoría de GET /api/v1/categorias/.
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          description: 'Modalidades de venta que admite el producto, solas o combinadas:
            stock, produccion, personalizacion.'
          minItems: 1
      required:
      - categoria
      - descripcion
      - modalidades
      - nombre
      - precio
    ProductoPropio:
      type: object
      description: 'Producto del taller propio: añade su estado de publicación y última
        edición.'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
          title: Descripción
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Precio (C$)
          description: Precio vigente en córdobas. Los pedidos futuros congelarán
            su propio importe.
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
          description: 'Modalidades de venta que admite, en orden: stock, produccion,
            personalizacion.'
        taller:
          allOf:
          - $ref: '#/components/schemas/TallerResumen'
          readOnly: true
        publicado:
          type: boolean
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado_en
      - categoria
      - creado_en
      - descripcion
      - id
      - modalidades
      - nombre
      - precio
      - publicado
      - taller
    ProductoPublico:
      type: object
      description: Producto del catálogo público. Solo productos publicados de talleres
        aprobados.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
          title: Descripción
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Precio (C$)
          description: Precio vigente en córdobas. Los pedidos futuros congelarán
            su propio importe.
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/ModalidadEnum'
          readOnly: true
          description: 'Modalidades de venta que admite, en orden: stock, produccion,
            personalizacion.'
        taller:
          allOf:
          - $ref: '#/components/schemas/TallerResumen'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - categoria
      - creado_en
      - descripcion
      - id
      - modalidades
      - nombre
      - precio
      - taller
    RegistroArtesanoRequest:
      type: object
      description: Cuenta del artesano más los datos iniciales de su taller.
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre completo.
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo 8 caracteres; no puede ser común, solo numérica ni parecida
            al nombre o al teléfono.
        taller:
          allOf:
          - $ref: '#/components/schemas/PerfilTallerEntradaRequest'
          description: 'Datos iniciales del taller. Obligatorios: nombre, rubro y
            direccion_completa. El taller se crea pendiente de aprobación.'
      required:
      - nombre
      - password
      - taller
      - telefono
    RegistroRequest:
      type: object
      description: Datos para crear una cuenta. Cualquier otro campo se rechaza con
        400.
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre completo.
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          description: 'Teléfono de Nicaragua: 8 dígitos, con o sin separadores y
            con o sin prefijo +505.'
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo 8 caracteres; no puede ser común, solo numérica ni parecida
            al nombre o al teléfono.
      required:
      - nombre
      - password
      - telefono
    RolEnum:
      enum:
      - comprador
      - artesano
      type: string
      description: |-
        * `comprador` - Comprador
        * `artesano` - Artesano
    Salud:
      type: object
      properties:
        estado:
          type: string
      required:
      - estado
    Sesion:
      type: object
      properties:
        access:
          type: string
          description: Token de acceso. Guardarlo solo en memoria y enviarlo como
            Bearer.
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
      - access
      - usuario
    TallerPropio:
      type: object
      description: 'Taller del artesano autenticado: el perfil y el resultado de su
        revisión.'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
          title: Nombre del taller
        historia:
          type: string
          readOnly: true
        rubro:
          type: string
          readOnly: true
        direccion_completa:
          type: string
          readOnly: true
          title: Dirección completa
        horario:
          type: string
          readOnly: true
          title: Horario de atención
        telefono_publico:
          type: string
          readOnly: true
          title: Teléfono público
        whatsapp_publico:
          type: string
          readOnly: true
          title: WhatsApp público
        facebook_url:
          type: string
          format: uri
          readOnly: true
          title: Facebook
        instagram_url:
          type: string
          format: uri
          readOnly: true
          title: Instagram
        sitio_web:
          type: string
          format: uri
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoTallerEnum'
          readOnly: true
        motivo_rechazo:
          type: string
          readOnly: true
          title: Motivo del rechazo
        revisado_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado_en
      - creado_en
      - direccion_completa
      - estado
      - facebook_url
      - historia
      - horario
      - id
      - instagram_url
      - motivo_rechazo
      - nombre
      - revisado_en
      - rubro
      - sitio_web
      - telefono_publico
      - whatsapp_publico
    TallerPublico:
      type: object
      description: Perfil público del taller aprobado. Sin propietario, estado ni
        datos de la cuenta.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
          title: Nombre del taller
        historia:
          type: string
          readOnly: true
        rubro:
          type: string
          readOnly: true
        direccion_completa:
          type: string
          readOnly: true
          title: Dirección completa
        horario:
          type: string
          readOnly: true
          title: Horario de atención
        telefono_publico:
          type: string
          readOnly: true
          title: Teléfono público
        whatsapp_publico:
          type: string
          readOnly: true
          title: WhatsApp público
        facebook_url:
          type: string
          format: uri
          readOnly: true
          title: Facebook
        instagram_url:
          type: string
          format: uri
          readOnly: true
          title: Instagram
        sitio_web:
          type: string
          format: uri
          readOnly: true
      required:
      - direccion_completa
      - facebook_url
      - historia
      - horario
      - id
      - instagram_url
      - nombre
      - rubro
      - sitio_web
      - telefono_publico
      - whatsapp_publico
    TallerResumen:
      type: object
      description: 'Referencia al perfil público del taller: ``GET /api/v1/talleres/{id}/``.'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - id
      - nombre
    TokenAcceso:
      type: object
      properties:
        access:
          type: string
          description: Nuevo token de acceso.
      required:
      - access
    TokenCSRF:
      type: object
      properties:
        csrf_token:
          type: string
          description: Valor para la cabecera X-CSRFToken.
      required:
      - csrf_token
    Usuario:
      type: object
      description: Identidad autenticada. Sin contraseña, hash ni privilegios internos.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        telefono:
          type: string
          readOnly: true
          title: Teléfono
          description: 'Identificador de acceso: 8 dígitos, sin prefijo ni separadores.'
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
      required:
      - id
      - nombre
      - rol
      - telefono
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
