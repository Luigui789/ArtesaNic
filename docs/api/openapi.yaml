openapi: 3.0.3
info:
  title: API de ArtesaNic
  version: 0.1.0
  description: 'Contrato implementado por el backend. Requisitos y diseño de los demás
    módulos: monorepo (docs/requisitos, docs/api).'
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: obtener_token_csrf
      description: Fija la cookie csrftoken y devuelve el valor que debe enviarse
        en la cabecera X-CSRFToken de registro, login, refrescar y logout.
      summary: Obtener el token CSRF
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCSRF'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: iniciar_sesion
      description: 'El rol no se envía: lo determina la cuenta. Devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Iniciar sesión con teléfono y contraseña
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login:
                value:
                  telefono: '85551234'
                  password: …
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Credenciales incorrectas o cuenta inactiva (mensaje único,
            no revela si el teléfono existe).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido, o cuenta de administración.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/logout/:
    post:
      operationId: cerrar_sesion
      description: Revoca el token de renovación de la cookie y la borra. No exige
        el token de acceso, para poder cerrar aunque haya caducado; es idempotente.
      summary: Cerrar sesión
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/perfil/:
    get:
      operationId: consultar_perfil
      summary: Consultar la identidad autenticada
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
    patch:
      operationId: actualizar_perfil
      description: 'Actualización parcial de la cuenta autenticada: solo `nombre`
        y `telefono`. Cambiar de forma efectiva el teléfono de acceso exige `password_actual`;
        un teléfono que normaliza al actual no es un cambio. Rol, estado, privilegios
        y contraseña no son editables: cualquier otro campo responde 400. No exige
        CSRF (usa el token Bearer), no emite tokens nuevos y la sesión actual sigue
        válida. No modifica los contactos públicos del taller.'
      summary: Actualizar los datos personales propios
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActualizarPerfilRequest'
            examples:
              CambiarElNombre:
                value:
                  nombre: Ana Lucía López
                summary: Cambiar el nombre
              CambiarElTeléfono:
                value:
                  telefono: 8777 1234
                  password_actual: …
                summary: Cambiar el teléfono
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                CuentaActualizada:
                  value:
                    id: 4
                    nombre: Ana Lucía López
                    telefono: '87771234'
                    rol: artesano
                  summary: Cuenta actualizada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                TeléfonoYaRegistrado:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
                  summary: Teléfono ya registrado
                FaltaLaContraseñaActual:
                  value:
                    password_actual:
                    - Confirma tu contraseña actual para cambiar el teléfono.
                  summary: Falta la contraseña actual
                ContraseñaActualIncorrecta:
                  value:
                    password_actual:
                    - La contraseña actual no es correcta.
                  summary: Contraseña actual incorrecta
                CampoNoPermitido:
                  value:
                    rol:
                    - Campo no permitido.
                  summary: Campo no permitido
          description: 'Errores de validación: cada campo con su lista de mensajes.
            Los campos no editables responden «Campo no permitido.».'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/refrescar/:
    post:
      operationId: renovar_sesion
      description: Usa la cookie de renovación, la rota (la anterior queda revocada)
        y devuelve un token de acceso nuevo. Sin cuerpo.
      summary: Renovar el token de acceso
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAcceso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin cookie, o caducada, revocada o de una cuenta sin acceso.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/registro/artesano/:
    post:
      operationId: registrar_artesano
      description: 'Crea la cuenta de artesano y, en la misma operación, su taller
        en estado pendiente con los datos iniciales de `taller`. Si el taller no es
        válido no se crea ninguno de los dos. El teléfono de la cuenta es privado:
        los contactos públicos del taller son solo los que se envían en `taller`.
        La aprobación es exclusiva de la administración. El rol lo asigna el servidor;
        los campos no declarados se rechazan. Inicia la sesión: devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Registrar una cuenta de artesano
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroArtesanoRequest'
            examples:
              RegistroDeArtesano:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
                  taller:
                    nombre: Cerámica López
                    rubro: Cerámica artesanal
                    direccion_completa: Barrio San Juan, de la iglesia 2 c. al sur,
                      Masaya
                    historia: Taller familiar fundado en 1985.
                    horario: Lunes a sábado, 8:00 a 17:00
                    whatsapp_publico: 8777 6655
                    instagram_url: https://instagram.com/ceramicalopez
                summary: Registro de artesano
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: artesano
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/registro/comprador/:
    post:
      operationId: registrar_comprador
      description: 'Crea una cuenta de comprador. El rol lo asigna el servidor; los
        campos no declarados se rechazan. Inicia la sesión: devuelve el token de acceso
        y fija la cookie de renovación.'
      summary: Registrar una cuenta de comprador
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            examples:
              Registro:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/categorias/:
    get:
      operationId: listar_categorias
      description: Colección completa, por nombre y sin paginar.
      summary: Listar las categorías
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
  /api/v1/configuracion/:
    get:
      operationId: consultar_configuracion
      description: 'Tasa de cambio informativa C$ por US$ que configura la administración.
        Sin tasa configurada responde 200 con `tasa_cambio` y `actualizada_en` en
        null: no existe una tasa por defecto. Los importes contractuales se conservan
        en córdobas.'
      summary: Consultar la configuración pública de la plataforma
      tags:
      - Configuración
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionPublica'
          description: ''
  /api/v1/inventario/:
    get:
      operationId: listar_mi_inventario
      description: Existencia física, reservada y disponible de los productos con
        inventario inicializado del taller propio aprobado (RF-022, RN-021).
      summary: Listar el inventario inicializado del taller propio
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Inventario
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventarioProductoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
  /api/v1/inventario/productos/{producto_id}/:
    get:
      operationId: consultar_inventario_de_producto
      description: Devuelve existencia física, cantidad reservada y disponibilidad
        de un producto del taller propio aprobado. 404 si el producto es ajeno, no
        existe o aún no tiene existencia inicial registrada.
      summary: Consultar existencias y disponibilidad de un producto propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Inventario
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioProducto'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
  /api/v1/inventario/productos/{producto_id}/ajustes/:
    post:
      operationId: ajustar_inventario
      description: 'Registra un ajuste positivo (`delta > 0`) o negativo (`delta <
        0`) con motivo obligatorio (RF-022, RN-021). Nunca reduce la existencia física
        por debajo de la cantidad reservada ni de cero (`409 ajuste_bajo_comprometido`).
        Exige inventario inicializado (`409 inventario_no_inicializado`). Protegida
        por `Idempotency-Key` (AUD-08). `Idempotency-Key` ausente o con formato inválido
        responde `{"Idempotency-Key": ["..."]}`, antes de validar el cuerpo.'
      summary: Ajustar la existencia física de un producto propio con motivo
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Inventario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteInventarioRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioProducto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoInventario'
          description: 'Conflicto sin efectos; `codigo` estable: `inventario_no_inicializado`,
            `ajuste_bajo_comprometido`, `clave_idempotencia_reutilizada`.'
  /api/v1/inventario/productos/{producto_id}/entradas/:
    post:
      operationId: registrar_entrada_inventario
      description: 'Incrementa la existencia física (cantidad ≥ 1) y registra el movimiento
        `entrada` en la misma transacción. Exige inventario previamente inicializado
        (`409 inventario_no_inicializado`). Protegida por `Idempotency-Key` (AUD-08).
        `Idempotency-Key` ausente o con formato inválido responde `{"Idempotency-Key":
        ["..."]}`, antes de validar el cuerpo.'
      summary: Registrar una entrada de inventario en un producto propio
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Inventario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaInventarioRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioProducto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o no pertenece a esta parte.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoInventario'
          description: 'Conflicto sin efectos; `codigo` estable: `inventario_no_inicializado`,
            `clave_idempotencia_reutilizada`.'
  /api/v1/inventario/productos/{producto_id}/inicial/:
    post:
      operationId: establecer_inventario_inicial
      description: 'Inicializa por única vez el inventario del producto (cantidad
        ≥ 0) y registra el movimiento `existencia_inicial` en la misma transacción.
        Una segunda inicialización con otra clave responde `409 inventario_ya_inicializado`.
        Protegida por `Idempotency-Key` (AUD-08). `Idempotency-Key` ausente o con
        formato inválido responde `{"Idempotency-Key": ["..."]}`, antes de validar
        el cuerpo.'
      summary: Registrar la existencia inicial de un producto propio
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Inventario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExistenciaInicialEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
