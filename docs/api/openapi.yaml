openapi: 3.0.3
info:
  title: API de ArtesaNic
  version: 0.1.0
  description: 'Contrato implementado por el backend. Requisitos y diseño de los demás
    módulos: monorepo (docs/requisitos, docs/api).'
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: obtener_token_csrf
      description: Fija la cookie csrftoken y devuelve el valor que debe enviarse
        en la cabecera X-CSRFToken de registro, login, refrescar y logout.
      summary: Obtener el token CSRF
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCSRF'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: iniciar_sesion
      description: 'El rol no se envía: lo determina la cuenta. Devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Iniciar sesión con teléfono y contraseña
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login:
                value:
                  telefono: '85551234'
                  password: …
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Credenciales incorrectas o cuenta inactiva (mensaje único,
            no revela si el teléfono existe).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido, o cuenta de administración.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/logout/:
    post:
      operationId: cerrar_sesion
      description: Revoca el token de renovación de la cookie y la borra. No exige
        el token de acceso, para poder cerrar aunque haya caducado; es idempotente.
      summary: Cerrar sesión
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/perfil/:
    get:
      operationId: consultar_perfil
      summary: Consultar la identidad autenticada
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
  /api/v1/auth/refrescar/:
    post:
      operationId: renovar_sesion
      description: Usa la cookie de renovación, la rota (la anterior queda revocada)
        y devuelve un token de acceso nuevo. Sin cuerpo.
      summary: Renovar el token de acceso
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Cookie HttpOnly emitida por el backend. El navegador la envía
          sola.
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAcceso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin cookie, o caducada, revocada o de una cuenta sin acceso.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
  /api/v1/auth/registro/artesano/:
    post:
      operationId: registrar_artesano
      description: 'Crea la cuenta de artesano y, en la misma operación, su taller
        en estado pendiente con los datos iniciales de `taller`. Si el taller no es
        válido no se crea ninguno de los dos. El teléfono de la cuenta es privado:
        los contactos públicos del taller son solo los que se envían en `taller`.
        La aprobación es exclusiva de la administración. El rol lo asigna el servidor;
        los campos no declarados se rechazan. Inicia la sesión: devuelve el token
        de acceso y fija la cookie de renovación.'
      summary: Registrar una cuenta de artesano
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroArtesanoRequest'
            examples:
              RegistroDeArtesano:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
                  taller:
                    nombre: Cerámica López
                    rubro: Cerámica artesanal
                    direccion_completa: Barrio San Juan, de la iglesia 2 c. al sur,
                      Masaya
                    historia: Taller familiar fundado en 1985.
                    horario: Lunes a sábado, 8:00 a 17:00
                    whatsapp_publico: 8777 6655
                    instagram_url: https://instagram.com/ceramicalopez
                summary: Registro de artesano
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: artesano
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/auth/registro/comprador/:
    post:
      operationId: registrar_comprador
      description: 'Crea una cuenta de comprador. El rol lo asigna el servidor; los
        campos no declarados se rechazan. Inicia la sesión: devuelve el token de acceso
        y fija la cookie de renovación.'
      summary: Registrar una cuenta de comprador
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token de GET /api/v1/auth/csrf/. La petición debe llevar también
          la cookie csrftoken (credentials: ''include'').'
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            examples:
              Registro:
                value:
                  nombre: Ana Lucía Delgado
                  telefono: 8555 1234
                  password: …
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                SesiónIniciada:
                  value:
                    access: eyJhbGciOi…
                    usuario:
                      id: 4
                      nombre: Ana Lucía Delgado
                      telefono: '85551234'
                      rol: comprador
                  summary: Sesión iniciada
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Token CSRF ausente o inválido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Demasiados intentos. La cabecera Retry-After indica la espera.
  /api/v1/categorias/:
    get:
      operationId: listar_categorias
      description: Colección completa, por nombre y sin paginar.
      summary: Listar las categorías
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
  /api/v1/productos/:
    get:
      operationId: listar_catalogo
      description: Productos publicados de talleres aprobados, paginados. Búsqueda
        por nombre; filtros por categoría, rango de precio y taller; orden por fecha,
        precio o nombre. Un parámetro con formato inválido responde 400.
      summary: Consultar el catálogo público
      parameters:
      - in: query
        name: categoria
        schema:
          type: string
          maxLength: 50
        description: Código de categoría.
      - in: query
        name: orden
        schema:
          enum:
          - recientes
          - precio_asc
          - precio_desc
          - nombre
          type: string
          default: recientes
          minLength: 1
        description: |-
          recientes (por defecto), precio_asc, precio_desc o nombre.

          * `recientes` - recientes
          * `precio_asc` - precio_asc
          * `precio_desc` - precio_desc
          * `nombre` - nombre
      - name: page
        required: false
        in: query
        description: Número de página, desde 1. Una página inexistente responde 404.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: 'Resultados por página: 12 por defecto, 48 como máximo.'
        schema:
          type: integer
          minimum: 1
          maximum: 48
          default: 12
      - in: query
        name: precio_max
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio máximo.
      - in: query
        name: precio_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description: Precio mínimo.
      - in: query
        name: q
        schema:
          type: string
          maxLength: 120
        description: Búsqueda por nombre (contiene, sin mayúsculas).
      - in: query
        name: taller
        schema:
          type: integer
          minimum: 1
        description: Identificador del taller.
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoPublicoList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
  /api/v1/productos/{producto_id}/:
    get:
      operationId: consultar_producto
      summary: Consultar un producto del catálogo
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Catálogo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPublico'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe, no está publicado o su taller no está aprobado.
  /api/v1/productos/mios/:
    get:
      operationId: listar_mis_productos
      description: Publicados y despublicados, del más reciente al más antiguo, paginados.
        El taller se deriva del token.
      summary: Listar los productos del taller propio
      parameters:
      - name: page
        required: false
        in: query
        description: Número de página, desde 1. Una página inexistente responde 404.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: 'Resultados por página: 12 por defecto, 48 como máximo.'
        schema:
          type: integer
          minimum: 1
          maximum: 48
          default: 12
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoPropioList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
    post:
      operationId: crear_producto
      description: Crea el producto sin publicar; se publica con la acción publicar.
        Todos los campos son obligatorios. Taller, publicación y cualquier otro campo
        se rechazan con 400. La fotografía principal está pendiente de la decisión
        DR-01.
      summary: Registrar un producto en el taller propio
      tags:
      - Productos propios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
  /api/v1/productos/mios/{producto_id}/:
    get:
      operationId: consultar_mi_producto
      description: |-
        Productos del taller del artesano autenticado y aprobado.

        El taller sale de la identidad: el queryset se limita a él y ``EsPropietario``
        lo comprueba de nuevo por objeto. Un producto ajeno responde 404, como uno inexistente.
      summary: Consultar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
    patch:
      operationId: actualizar_mi_producto
      description: 'Modifica solo los campos enviados. `modalidades` reemplaza la
        lista completa. No cambia taller, publicación ni fecha de alta: enviarlos
        responde 400. Editar no altera pedidos confirmados, que conservarán sus propios
        datos (RN-003).'
      summary: Editar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductoEntradaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                Validación:
                  value:
                    telefono:
                    - Ya existe una cuenta con este teléfono.
          description: 'Errores de validación: cada campo con su lista de mensajes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/productos/mios/{producto_id}/despublicar/:
    post:
      operationId: despublicar_mi_producto
      description: Lo retira del catálogo público y de nuevas solicitudes sin borrarlo
        (RF-019). Idempotente. Sin cuerpo.
      summary: Despublicar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/productos/mios/{producto_id}/publicar/:
    post:
      operationId: publicar_mi_producto
      description: 'Lo muestra en el catálogo público. Idempotente: publicar un producto
        ya publicado responde 200 sin cambios. Sin cuerpo.'
      summary: Publicar un producto del taller propio
      parameters:
      - in: path
        name: producto_id
        schema:
          type: integer
        required: true
      tags:
      - Productos propios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPropio'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o token no válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: La cuenta no es de artesano o su taller no está aprobado (RN-002).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe o pertenece a otro taller.
  /api/v1/salud/:
    get:
      operationId: consultar_salud
      summary: Comprobar que el servicio responde
      tags:
      - Salud
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
          description: ''
  /api/v1/solicitudes/:
    post:
      operationId: crear_solicitud
      description: Comprador derivado del token; taller derivado de los productos
        publicados de un taller aprobado. Stock requiere cantidad; producción también
        fecha solicitada; personalización también características y origen. No confirma
        pedido, congela precio ni reserva inventario. La protección servidor ante
        reintentos queda para AUD-08.
      summary: Enviar una solicitud de un taller
      tags:
      - Solicitudes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudComprador'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
  /api/v1/solicitudes/mias/:
    get:
      operationId: listar_mis_solicitudes
      summary: Listar las solicitudes propias
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Solicitudes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSolicitudCompradorList'
