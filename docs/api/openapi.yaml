  /api/v1/solicitudes/:
    post:
      operationId: crear_solicitud
      description: 'Comprador derivado del token; taller derivado de los productos
        publicados de un taller aprobado. Stock requiere cantidad; producción también
        fecha solicitada; personalización también características y origen. Preferencia
        de entrega opcional (RF-016); «otra» exige descripción. No confirma pedido,
        congela precio ni reserva inventario. Protegida contra reintentos (AUD-08):
        exige Idempotency-Key; repetir la misma clave y el mismo cuerpo devuelve la
        solicitud ya creada con 201 e Idempotency-Replayed; la misma clave con otro
        cuerpo (incluida otra preferencia de entrega) responde 409. `Idempotency-Key`
        ausente o con formato inválido responde `{"Idempotency-Key": ["..."]}`, antes
        de validar el cuerpo.'
      summary: Enviar una solicitud de un taller
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
        required: true
      tags:
      - Solicitudes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEntradaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudComprador'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Errores por campo; renglones contiene errores por posición,
            en orden. La solicitud completa se rechaza sin persistencia parcial.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin token o sesión no válida.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rol incorrecto, o taller del artesano no aprobado.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictoIdempotencia'
          description: '`clave_idempotencia_reutilizada`: la clave ya identifica otra
            petición de este actor. No se ejecuta la operación.'
