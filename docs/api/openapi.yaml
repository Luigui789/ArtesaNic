        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente con «true» cuando la respuesta repite una ejecución
                anterior. Informativo: mismo recurso y código registrado; el cuerpo
                refleja el estado actual del recurso, no un snapshot de la primera
                respuesta.'
