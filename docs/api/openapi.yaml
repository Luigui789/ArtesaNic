  /api/v1/pedidos/recibidos/{pedido_id}/pago/intentos/{intento_id}/resolver/:
    post:
      operationId: resolver_intento_de_pago
      description: 'Resolución única del artesano sobre el intento registrado. `confirmado`:
        fondos verificados; sin motivo; terminal (no admite nuevos intentos ni otra
        resolución). `observado`: problema con la evidencia o los datos (ilegible,
        incompleta, referencia incorrecta); motivo obligatorio (1–1000 caracteres
        tras recortar); abre 48 h para corregir. `no_recibido`: los fondos no aparecen
        acreditados en el medio externo; motivo obligatorio; abre 48 h para un nuevo
        intento. No modifica inventario ni el estado del pedido. Protegida por `Idempotency-Key`:
        huella con pedido, intento, estado y motivo recortado. `Idempotency-Key` ausente
        o con formato inválido responde `{"Idempotency-Key": ["..."]}`, antes de validar
        el cuerpo.'
      summary: Confirmar, observar o marcar como no recibido un intento de pago
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:~-]{16,128}$
        description: 'Clave generada por el cliente para este intento lógico (se recomienda
          un UUID v4). Reenviar la misma clave con la misma petición devuelve el mismo
          recurso sin repetir la operación; con otra petición responde 409. Claves
          distintas son operaciones distintas aunque el contenido coincida. Ámbito:
          actor autenticado y tipo de operación. 16–128 caracteres.'
